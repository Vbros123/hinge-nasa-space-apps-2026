# Model parameters v2 (Phase 2). Phase 1 file preserved in config/phase1_frozen/.
# Parameter sets are traceable sensitivity scenarios; "category" groups them for robustness.py.
model_version: screening-v2
site:
  name: Johnston County NC (demo point)
  latitude_deg: 35.51
  elevation_m: 50
  status: assumed
  note: Approximate; replace from Person 1's manifest.
  region: coastal_plain
  region_status: assumed (Johnston County straddles the Coastal Plain / Piedmont boundary; NC State region assignment not
    verified)
et0:
  method: penman_monteith
  albedo: 0.23
  soil_heat_flux_mj_m2_day: 0.0
  source: fao56
water:
  initial_storage_fraction: 0.5
  spinup_years: 0
  runoff_fraction: 0.0
  fallow_kc: 0.3
  residue_kc_multiplier: 0.75
  cover_kc:
    initial: 0.4
    mid: 1.0
    end: 0.4
  mass_balance_tolerance_mm: 1.0e-09
soil_storage_scenarios_mm:
  low_storage:
    value: 60
    status: illustrative
  medium_storage:
    value: 100
    status: illustrative
  high_storage:
    value: 140
    status: illustrative
cover_function:
  ramp_days: 45
  decline_days: 10
  status: assumed
  note: ramp_days and decline_days assumed
heat_exposure:
  tmax_threshold_c: null
  descriptive_thresholds_c:
  - 30
  - 35
history:
  block_years: 3
  allow_incomplete_years: false
management_defaults:
  equipment_available:
  - planter
  - combine
  - grain_drill
  termination_methods_available:
  - herbicide
  market_access_confirmed:
    winter_wheat: true
  excluded_crops: []
  irrigation: rainfed
  status: assumed
min_slack_days_warning: 3
parameter_sets:
  reference:
    storage: medium_storage
    status: reference
    category: reference
  low_storage:
    storage: low_storage
    status: illustrative
    category: soil_storage
  high_storage:
    storage: high_storage
    status: illustrative
    category: soil_storage
  kc_end_sourced_alt:
    storage: medium_storage
    kc_overrides:
      corn:
        kc_end: 0.35
      winter_wheat:
        kc_end: 0.4
    status: sourced_alternative
    category: kc
  rye_terminate_early:
    storage: medium_storage
    op_overrides:
    - crop: cereal_rye
      action: terminate
      date: 03-25
    status: sourced_window_bound
    category: cover_termination
  rye_terminate_late:
    storage: medium_storage
    op_overrides:
    - crop: cereal_rye
      action: terminate
      date: 04-15
    status: sourced_window_bound
    category: cover_termination
  corn_plant_early:
    storage: medium_storage
    shift_days:
    - crop: corn
      action: plant
      days: -10
    status: assumed_range
    category: corn_planting
  corn_plant_late:
    storage: medium_storage
    shift_days:
    - crop: corn
      action: plant
      days: 10
    status: assumed_range
    category: corn_planting
  kc_mid_humid_adj:
    storage: medium_storage
    category: kc
    status: inferred_fao56_eq62
    kc_overrides:
      corn:
        kc_mid: 1.165
      soybean:
        kc_mid: 1.124
      winter_wheat:
        kc_mid: 1.121
    note: FAO-56 Eq. 62 humid-climate adjustment with ASSUMED u2=2 m/s and RHmin=55%, heights 2.0/0.75/1.0 m
  wheat_kc_ini_frozen:
    storage: medium_storage
    category: kc
    status: sourced_alternative
    kc_overrides:
      winter_wheat:
        kc_initial: 0.4
    note: FAO-56 Table 12 value for frozen soils
  corn_stage_alt:
    storage: medium_storage
    category: kc_stage
    status: sourced_secondary_alternative
    stage_overrides:
      corn:
        initial: 20
        development: 35
        mid: 40
        late: 30
  wheat_stage_idaho:
    storage: medium_storage
    category: kc_stage
    status: sourced_secondary_alternative
    stage_overrides:
      winter_wheat:
        initial: 160
        development: 75
        mid: 75
        late: 25
  wheat_stage_winter_cereal:
    storage: medium_storage
    category: kc_stage
    status: sourced_secondary_alternative
    stage_overrides:
      winter_wheat:
        initial: 20
        development: 60
        mid: 70
        late: 30
  fallow_kc_low:
    storage: medium_storage
    category: fallow_residue
    status: assumed_range
    water_overrides:
      fallow_kc: 0.15
  fallow_kc_high:
    storage: medium_storage
    category: fallow_residue
    status: assumed_range
    water_overrides:
      fallow_kc: 0.5
  residue_mult_none:
    storage: medium_storage
    category: fallow_residue
    status: assumed_range
    water_overrides:
      residue_kc_multiplier: 1.0
  residue_mult_strong:
    storage: medium_storage
    category: fallow_residue
    status: assumed_range
    water_overrides:
      residue_kc_multiplier: 0.5
  cover_kc_low:
    storage: medium_storage
    category: cover_development
    status: assumed_range
    water_overrides:
      cover_kc:
        initial: 0.3
        mid: 0.8
        end: 0.3
  cover_kc_high:
    storage: medium_storage
    category: cover_development
    status: assumed_range
    water_overrides:
      cover_kc:
        initial: 0.7
        mid: 1.15
        end: 0.25
    note: winter-wheat-like Kc (FAO-56 Table 12 analogue); upper bound
  cover_ramp_fast:
    storage: medium_storage
    category: cover_development
    status: assumed_range
    cover_function_overrides:
      ramp_days: 30
  cover_ramp_slow:
    storage: medium_storage
    category: cover_development
    status: assumed_range
    cover_function_overrides:
      ramp_days: 60
  init_storage_25:
    storage: medium_storage
    category: initial_storage
    status: assumed_range
    water_overrides:
      initial_storage_fraction: 0.25
  init_storage_75:
    storage: medium_storage
    category: initial_storage
    status: assumed_range
    water_overrides:
      initial_storage_fraction: 0.75
  spinup_1yr:
    storage: medium_storage
    category: initial_storage
    status: method_alternative
    spinup_years: 1
    note: initial storage = end-of-previous-year storage from a rotation-independent fallow-with-residue run starting at 50%;
      falls back to 50% when no complete preceding year exists
